name: etp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-etp}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP. During first-time init, the image runs a
      # temporary server on the unix socket only; checking over TCP avoids
      # reporting "healthy" before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Cache, rate limits, OTP codes and short seat locks. Everything in it has a
  # TTL and may be lost (PostgreSQL stays the source of truth), so nothing is
  # written to disk. noeviction is required by BullMQ (Phase 9).
  redis:
    image: redis:7.4-alpine
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy noeviction --save "" --appendonly no
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      # Bound to localhost only: reachable by the tests on this machine, not the network.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Development SMTP server: accepts every email and shows it in a web inbox
  # at http://localhost:8025. Nothing is delivered to real addresses.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  # One-shot: applies migrations, then exits. The API starts only after it
  # succeeds, so several API replicas never race to migrate.
  migrate:
    build: ./backend
    command: ["npm", "run", "migrate:up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-etp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-etp}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-etp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-etp}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      OTP_SECRET: ${OTP_SECRET:?Set OTP_SECRET in .env}
      QR_SECRET: ${QR_SECRET:?Set QR_SECRET in .env}
      # Defaults to the local Mailpit inbox; set SMTP_* in .env to send real email.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Event Tickets <no-reply@etp.local>}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Browser origins of the web app (WebSocket Origin check, Phase 11).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080,https://localhost:8443}
      # The web container (nginx) is the one proxy in front of the API: trust
      # its X-Forwarded-For so rate limits count per visitor, not per proxy.
      # Only the address nginx itself appends is used (a client cannot fake it).
      TRUST_PROXY: ${TRUST_PROXY:-1}
    # Event images uploaded from the web (Phase 12.2) survive rebuilds.
    volumes:
      - uploads:/app/uploads
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # The slim image has no curl; Node's built-in fetch does the job.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Background jobs (BullMQ): tickets, emails, timed hold expiry, notifications,
  # maintenance. Same image as the API; scale it independently.
  worker:
    build: ./backend
    command: ["node", "src/worker.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-etp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-etp}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      OTP_SECRET: ${OTP_SECRET:?Set OTP_SECRET in .env}
      QR_SECRET: ${QR_SECRET:?Set QR_SECRET in .env}
      # Defaults to the local Mailpit inbox; set SMTP_* in .env to send real email.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Event Tickets <no-reply@etp.local>}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    # SIGTERM lets running jobs finish; give them time before SIGKILL.
    stop_grace_period: 30s
    restart: unless-stopped

  # The web app (Phase 11.4): nginx serves the build and forwards /api, /ws to
  # the API. http://localhost:8080 on this computer; https://<this-ip>:8443 on a
  # phone (the QR scanner needs HTTPS for the camera; self-signed certificate).
  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:8080"
      - "${WEB_HTTPS_PORT:-8443}:8443"
    volumes:
      - webcerts:/etc/nginx/certs
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  webcerts:
