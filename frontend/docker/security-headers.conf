# Security headers of the web app's pages and files (Phase 14). Included in
# each location that serves the app: nginx does not inherit add_header into a
# location that has its own add_header. API answers carry Helmet's headers.
#
# Content-Security-Policy:
#  - scripts and styles only from this site (the build has no inline script);
#    'wasm-unsafe-eval' lets the QR reader fallback compile its WebAssembly
#  - images also from any https site (an event image may be a link) and blob:
#    / data: (ticket QR, previews of a chosen file)
#  - the API and the WebSocket on this same host
#  - never inside a frame of another site (clickjacking), no plugins
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' https: data: blob:; media-src 'self' blob:; connect-src 'self' ws://$http_host wss://$http_host; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Only these pages may use the camera (gate scanner); nothing else is needed.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
# Strict-Transport-Security is left for production: port 8443 uses a
# self-signed development certificate (docs/production-checklist.md).
