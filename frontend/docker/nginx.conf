# The web app (static files) + the API behind the same origin.
# On a computer: http://localhost:8080, and https://<ip>:8443 for phones (camera).
# In production (Phase 16) Caddy terminates HTTPS in front of port 8080; 8443
# is not published there.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Behind Caddy the request reached nginx over plain HTTP: tell the API the
# scheme the browser used (Caddy's header), else the one of this connection.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/web.crt;
  ssl_certificate_key /etc/nginx/certs/web.key;

  root /usr/share/nginx/html;
  server_tokens off;

  # Look the API up through Docker's DNS on every request (cached 10 s), not
  # once at start: a recreated api container gets a new IP, and nginx would
  # keep sending to the old one (502 until restarted). A variable in
  # proxy_pass is what makes nginx resolve at run time.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  # Event images are uploaded through here (the API allows 5 MB).
  client_max_body_size 6m;

  # Compress API answers and the app files. A 2.000-seat map is ~470 KB of
  # JSON and ~70 KB gzipped (Phase 13 load test: p95 90 → 63 ms, 6x less traffic).
  gzip on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/json application/javascript text/css image/svg+xml;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Health of the API (Phase 16): deploy checks, uptime monitors.
  location ~ ^/health/(live|ready)$ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ws {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  # Hashed build files never change: cache them for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Every other path is a page of the app (React Router): serve index.html,
  # never cached, so a new build is picked up on the next visit.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
