# Round robin over every API replica. Docker's DNS answers "load-api" with one
# address per replica; nginx reads them all when it starts (so restart "lb"
# "load-lb" after changing LOAD_API_REPLICAS).
upstream api {
  server load-api:3000;
  keepalive 64;
}

server {
  listen 3200;
  access_log off;

  # Same compression as the web container (frontend/docker/nginx.conf): a
  # 2.000-seat map is ~470 KB of JSON, ~10 times smaller gzipped.
  gzip on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json;

  location / {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
